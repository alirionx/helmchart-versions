<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helm Chart Versions</title>
  <script>
    // Apply the stored theme before the first render to avoid a flash (dark by default)
    (function () {
      var theme = 'dark';
      try { if (localStorage.getItem('hv-theme') === 'light') theme = 'light'; } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- app.js defines charts() and must load before Alpine starts -->
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
  <!-- Icons (Lucide, ISC license) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-list" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><path d="M14 4h7M14 9h7M14 15h7M14 20h7"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  </svg>

  <div class="layout" x-data="charts()" x-init="load()">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="Home">
        <!-- Logo: a helm wheel in the accent color -->
        <svg width="38" height="38" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="var(--primary)"/>
          <g fill="none" stroke="var(--on-primary)" stroke-width="2.6" stroke-linecap="round">
            <circle cx="16" cy="16" r="6.5"/>
            <path d="M16 5v4.5M16 22.5V27M5 16h4.5M22.5 16H27M8.2 8.2l3.2 3.2M20.6 20.6l3.2 3.2M23.8 8.2l-3.2 3.2M11.4 20.6l-3.2 3.2"/>
          </g>
          <circle cx="16" cy="16" r="2.4" fill="var(--on-primary)"/>
        </svg>
        <div>
          <div class="brand-title">helm</div>
          <div class="brand-subtitle">Chart versions</div>
        </div>
      </a>

      <nav aria-label="Groups">
        <p class="nav-heading">Charts</p>
        <button class="nav-item" type="button" :class="{ active: activeGroup === null }" :aria-current="activeGroup === null"
                @click="activeGroup = null">
          <svg class="icon"><use href="#i-list"/></svg><span class="nav-text">All charts</span>
          <span class="count" x-text="items.length"></span>
        </button>
        <p class="nav-heading groups-heading" x-show="groups.length">Groups</p>
        <template x-for="g in groups" :key="g.name">
          <button class="nav-item" type="button" :class="{ active: activeGroup === g.name }" :aria-current="activeGroup === g.name"
                  @click="activeGroup = g.name" :title="g.name">
            <svg class="icon"><use href="#i-folder"/></svg><span class="nav-text" x-text="g.name"></span>
            <span class="count" x-text="g.count"></span>
          </button>
        </template>
        <button class="nav-item dim" type="button" x-show="groups.length && ungroupedCount" :class="{ active: activeGroup === '' }"
                :aria-current="activeGroup === ''" @click="activeGroup = ''">
          <svg class="icon"><use href="#i-folder"/></svg><span class="nav-text">Ungrouped</span>
          <span class="count" x-text="ungroupedCount"></span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" type="button" @click="toggleTheme()"
                :aria-label="dark ? 'Switch to light theme' : 'Switch to dark theme'">
          <svg class="icon"><use :href="dark ? '#i-sun' : '#i-moon'"/></svg>
          <span class="nav-label" x-text="dark ? 'Light mode' : 'Dark mode'"></span>
        </button>
      </div>
    </aside>

    <main class="page">
      <div class="page-head">
        <div>
          <h1 class="page-title" x-text="title"></h1>
          <p class="page-subtitle">
            <span x-text="inGroup.length + (inGroup.length === 1 ? ' chart' : ' charts')"></span>
            <span x-show="checkedAt" x-text="' · checked ' + formatDate(checkedAt)"></span>
          </p>
        </div>
        <div class="spacer"></div>
        <label class="input-wrap search">
          <svg class="icon"><use href="#i-search"/></svg>
          <input type="text" x-model="search" placeholder="Search name, source or group" aria-label="Search name, source or group">
        </label>
        <button class="btn btn-outlined btn-lg" type="button" @click="load(true)" :disabled="loading">
          <svg class="icon" :class="{ spin: loading }"><use href="#i-refresh"/></svg>
          <span x-text="loading ? 'Checking…' : 'Refresh all'"></span>
        </button>
        <button class="btn btn-primary btn-lg" type="button" @click="openForm()">
          <svg class="icon"><use href="#i-plus"/></svg>Add chart
        </button>
      </div>

      <p class="alert" x-show="error" x-cloak x-text="error"></p>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Chart</th><th>Type</th><th>Version</th><th>App version</th><th>Published</th><th>Checked</th><th></th></tr>
            </thead>
            <tbody>
              <template x-for="c in filtered" :key="c.id">
                <tr>
                  <td>
                    <div>
                      <span class="name" x-text="c.name"></span>
                      <span class="chip group" x-show="c.group && activeGroup === null" x-text="c.group"></span>
                    </div>
                    <div class="src" x-text="c.source + (c.chart ? ' · ' + c.chart : '')"></div>
                  </td>
                  <td><span class="chip" :class="c.type" x-text="c.type.toUpperCase()"></span></td>
                  <td>
                    <span class="version" x-show="c.version" x-text="c.version"></span>
                    <span class="err" x-show="c.error" x-text="c.error"></span>
                  </td>
                  <td :class="{ dim: !c.appVersion }" x-text="c.appVersion ?? '—'"></td>
                  <td class="nowrap" :class="{ dim: !c.created }" x-text="c.created ? formatDate(c.created, false) : '—'"></td>
                  <td class="nowrap dim" x-text="formatDate(c.checkedAt)"></td>
                  <td>
                    <div class="actions">
                      <button class="icon-btn primary" type="button" :disabled="busy[c.id]" @click="refreshOne(c)"
                              :aria-label="'Refresh ' + c.name" :title="'Refresh ' + c.name">
                        <svg class="icon" :class="{ spin: busy[c.id] }"><use href="#i-refresh"/></svg>
                      </button>
                      <button class="icon-btn" type="button" @click="openVersions(c)" :aria-label="'Version history of ' + c.name" :title="'Version history of ' + c.name">
                        <svg class="icon"><use href="#i-history"/></svg>
                      </button>
                      <button class="icon-btn" type="button" @click="openForm(c)" :aria-label="'Edit ' + c.name" :title="'Edit ' + c.name">
                        <svg class="icon"><use href="#i-pencil"/></svg>
                      </button>
                      <button class="icon-btn secondary" type="button" @click="askDelete(c)" :aria-label="'Delete ' + c.name" :title="'Delete ' + c.name">
                        <svg class="icon"><use href="#i-trash"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <p class="empty" x-show="!loading && !filtered.length" x-cloak
           x-text="inGroup.length ? 'No charts match your search.' : 'No charts yet. Add your first one.'"></p>
        <p class="empty" x-show="loading && !items.length" x-cloak>Checking charts…</p>
      </div>
    </main>

    <!-- Add / edit -->
    <dialog x-ref="formDialog" @close="form.open = false">
      <form @submit.prevent="save()" novalidate>
        <h2 class="dialog-title" x-text="form.id ? 'Edit chart' : 'Add chart'"></h2>
        <div class="dialog-body">
          <label class="field" :class="{ invalid: form.errors.name }">
            <span class="field-label">Name</span>
            <input type="text" x-model="form.name" placeholder="e.g. cert-manager" autofocus>
            <span class="field-error" x-show="form.errors.name" x-text="form.errors.name"></span>
          </label>
          <label class="field" :class="{ invalid: form.errors.source }">
            <span class="field-label">Source</span>
            <input type="text" x-model="form.source" placeholder="https://charts.jetstack.io or oci://ghcr.io/org/charts/name">
            <span class="field-error" x-show="form.errors.source" x-text="form.errors.source"></span>
            <span class="field-hint" x-show="!form.errors.source"
                  x-text="isOci ? 'OCI registry – the chart is part of the address.' : 'HTTP repo URL (without /index.yaml) or oci:// address.'"></span>
          </label>
          <label class="field" x-show="!isOci" :class="{ invalid: form.errors.chart }">
            <span class="field-label">Chart</span>
            <input type="text" x-model="form.chart" placeholder="e.g. cert-manager">
            <span class="field-error" x-show="form.errors.chart" x-text="form.errors.chart"></span>
          </label>
          <label class="field" :class="{ invalid: form.errors.group }">
            <span class="field-label">Group (optional)</span>
            <input type="text" x-model="form.group" list="group-list" placeholder="e.g. Ingress" maxlength="40">
            <datalist id="group-list">
              <template x-for="g in groups" :key="g.name"><option :value="g.name"></option></template>
            </datalist>
            <span class="field-error" x-show="form.errors.group" x-text="form.errors.group"></span>
            <span class="field-hint" x-show="!form.errors.group">Pick an existing group or type a new one.</span>
          </label>
          <p class="alert" x-show="form.errors._" x-text="form.errors._"></p>
        </div>
        <div class="dialog-actions">
          <button class="btn" type="button" @click="$refs.formDialog.close()">Cancel</button>
          <button class="btn btn-primary" type="submit" :disabled="form.saving"
                  x-text="form.saving ? 'Saving…' : (form.id ? 'Save' : 'Add')"></button>
        </div>
      </form>
    </dialog>

    <!-- Version history -->
    <dialog class="wide" x-ref="versionsDialog">
      <h2 class="dialog-title" x-text="'Versions of ' + (hist.chart?.name ?? '')"></h2>
      <p class="dialog-sub" x-text="hist.chart ? hist.chart.source + (hist.chart.chart ? ' · ' + hist.chart.chart : '') : ''"></p>
      <div class="dialog-body">
        <div class="toolbar">
          <label class="check">Show
            <select x-model.number="hist.limit" @change="loadVersions()">
              <option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" x-model="hist.prereleases" @change="loadVersions()">Include pre-releases</label>
          <span class="spacer"></span>
          <button class="icon-btn primary" type="button" @click="loadVersions(true)" :disabled="hist.loading" aria-label="Refresh versions" title="Refresh versions">
            <svg class="icon" :class="{ spin: hist.loading }"><use href="#i-refresh"/></svg>
          </button>
        </div>
        <p class="alert" x-show="hist.error" x-text="hist.error"></p>
        <div class="versions" x-show="hist.versions.length">
          <table>
            <thead><tr><th>Version</th><th>App version</th><th>Published</th></tr></thead>
            <tbody>
              <template x-for="v in hist.versions" :key="v.version">
                <tr>
                  <td class="nowrap">
                    <span class="version" x-text="v.version"></span>
                    <span class="chip latest" x-show="v.version === hist.latest">LATEST</span>
                    <span class="chip pre" x-show="v.prerelease">PRE</span>
                  </td>
                  <td :class="{ dim: !v.appVersion }" x-text="v.appVersion ?? '—'"></td>
                  <td class="nowrap" :class="{ dim: !v.created }" x-text="v.created ? formatDate(v.created, false) : '—'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <p class="dim" x-show="!hist.loading && !hist.error && !hist.versions.length">No versions found.</p>
        <p class="dim" x-show="hist.total" x-text="'Showing ' + hist.versions.length + ' of ' + hist.total + (hist.chart?.type === 'oci' ? ' · app version and publish date are not available for OCI' : '')"></p>
      </div>
      <div class="dialog-actions">
        <button class="btn" type="button" @click="$refs.versionsDialog.close()">Close</button>
      </div>
    </dialog>

    <!-- Delete confirmation -->
    <dialog x-ref="deleteDialog">
      <h2 class="dialog-title">Delete chart?</h2>
      <div class="dialog-body">
        <p>"<span x-text="deleting?.name"></span>" will be removed from the list.</p>
      </div>
      <div class="dialog-actions">
        <button class="btn" type="button" @click="$refs.deleteDialog.close()">Cancel</button>
        <button class="btn btn-error" type="button" @click="confirmDelete()">Delete</button>
      </div>
    </dialog>

    <div class="toast" x-show="toast" x-cloak x-transition.opacity :class="toast ? toast.kind : ''" x-text="toast?.text" role="status"></div>
  </div>
</body>
</html>
